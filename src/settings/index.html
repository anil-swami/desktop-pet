<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'">
  <meta name="color-scheme" content="light dark">
  <title>Settings</title>
  <link rel="stylesheet" href="settings.css">
</head>
<body>
  <header class="top">
    <img class="top__pet" src="../../assets/characters/default/idle.svg" alt="">
    <div>
      <h1 class="top__title">Settings</h1>
      <p class="top__subtitle">Changes apply right away and are saved on this PC.</p>
    </div>
  </header>

  <main id="settings" class="sections" aria-live="polite" aria-busy="true"></main>

  <footer class="bottom">
    <p id="status" class="bottom__status" role="status"></p>
    <button id="reset" class="button" type="button">Reset to defaults</button>
  </footer>

  <script type="module" src="settings.js"></script>
</body>
</html>
